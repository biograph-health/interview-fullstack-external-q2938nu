services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservations"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL
      - JWT_SECRET
      - MANAGEMENT_API_TOKEN
      - DEFAULT_TIMEZONE
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  diner-web:
    build:
      context: .
      dockerfile: apps/diner-web/Dockerfile
    environment:
      - NEXTAUTH_URL
      - NEXTAUTH_SECRET
      - API_BASE_URL
      - NEXT_PUBLIC_API_BASE_URL
      - NEXT_PUBLIC_POSTHOG_KEY
      - NEXT_PUBLIC_POSTHOG_HOST
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./apps/diner-web/src:/app/apps/diner-web/src

  restaurant-console:
    build:
      context: .
      dockerfile: apps/restaurant-console/Dockerfile
    environment:
      - API_BASE_URL
      - MANAGEMENT_API_TOKEN
    depends_on:
      api:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ./apps/restaurant-console/src:/app/apps/restaurant-console/src

volumes:
  postgres_data:
